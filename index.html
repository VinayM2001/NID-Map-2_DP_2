<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 1. ADDED: Viewport tag for proper mobile scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>NID Campus 3D Map Viewer - Mobile Controls</title>
    <!-- Include Three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Include necessary extensions -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body { margin: 0; background: #e0e0e0; overflow: hidden; }
        #container { width: 100vw; height: 100vh; }
        .controls {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 5;
        }
        /* Mobile-friendly button sizes */
        button {
            border: none;
            border-radius: 12px;
            padding: 15px 20px;
            background: rgba(0,0,0,0.6);
            color: white;
            cursor: pointer;
            font-size: 16px;
            min-width: 120px;
        }
        button:hover { background: rgba(0,0,0,0.8); }
        #compassBtn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 30px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transform: rotate(0deg);
            transition: transform 0.3s ease;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="container"></div>

    <div class="controls">
        <button onclick="setModel('Insti_map_Final.glb')">Institute Map</button>
        <button onclick="setModel('G_floor_Final.glb')">Ground Floor</button>
        <button onclick="setModel('1st_floor_Final.glb')">1st Floor</button>
        <button onclick="setModel('2nd_floor_Final.glb')">2nd Floor</button>
    </div>

    <div id="compassBtn">🧭</div>

    <script>
        // --- THREE.JS GLOBAL VARIABLES ---
        const container = document.getElementById('container');
        const compassBtn = document.getElementById('compassBtn');

        let scene, camera, renderer, controls, loader;
        let currentModel = null;
        const INITIAL_MODEL = 'Insti_map_Final.glb';

        // --- RAYCASTING VARIABLES ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // --- ORIENTATION VARIABLES ---
        let orientMode = false;
        let lastAlpha = 0;
        let offset = 0;
        let hasInitial = false;
        const INITIAL_CAMERA_DISTANCE = 5;

        // --- INITIALIZATION ---

        function init() {
            // 1. Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xe0e0e0);

            // 2. Camera
            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
            camera.position.set(0, 2, INITIAL_CAMERA_DISTANCE); 

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.shadowMap.enabled = true;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.3;
            container.appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7.5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // 5. Controls 
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 0, 0);
            controls.enableZoom = true; 
            controls.enablePan = true;
            
            // --- NEW: Camera Distance Limits ---
            controls.minDistance = INITIAL_CAMERA_DISTANCE * 0.5; // Max zoom in (e.g., 2.5m)
            controls.maxDistance = INITIAL_CAMERA_DISTANCE * 4.0; // Max zoom out (e.g., 20m)

            // --- NEW: Rotation Limits (Disable Alpha/Horizontal, Enable Phi/Vertical) ---
            const fixedAlpha = 0; 
            controls.minAzimuthAngle = fixedAlpha; // Lock horizontal movement to one position
            controls.maxAzimuthAngle = fixedAlpha;
            
            // Optionally, limit vertical movement to prevent viewing completely under the map
            controls.minPolarAngle = Math.PI * 0.1;   // Limit how far down you can look
            controls.maxPolarAngle = Math.PI * 0.9;  // Limit how far up you can look (nearly 180 deg)
            
            controls.update();

            // 6. GLTF Loader
            loader = new THREE.GLTFLoader();

            // 7. Event Listeners
            window.addEventListener('resize', onWindowResize, false);
            renderer.domElement.addEventListener('click', onCanvasClick, false);
            window.addEventListener('deviceorientationabsolute', onDeviceOrientation, false);
            window.addEventListener('deviceorientation', onDeviceOrientation, false);

            loadModel(INITIAL_MODEL);
            animate();
        }

        // --- CORE FUNCTIONS ---

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function loadModel(modelName) {
            if (currentModel) {
                scene.remove(currentModel);
                currentModel = null;
            }

            loader.load(
                modelName,
                (gltf) => {
                    currentModel = gltf.scene;
                    scene.add(currentModel);

                    const box = new THREE.Box3().setFromObject(currentModel);
                    const center = box.getCenter(new THREE.Vector3());
                    controls.target.copy(center);
                    controls.update();
                },
                (xhr) => { console.log((xhr.loaded / xhr.total * 100).toFixed(0) + '% loaded'); },
                (error) => { console.error('Error loading model. Check file path:', modelName, error); }
            );
        }
        
        // --- RECENERING LOGIC ---

        function onCanvasClick(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            if (currentModel) {
                const intersects = raycaster.intersectObjects(currentModel.children, true);

                if (intersects.length > 0) {
                    const hitPoint = intersects[0].point;
                    controls.target.copy(hitPoint);
                    controls.update();
                }
            }
        }

        // --- BUTTON CONTROL FUNCTIONS ---

        function setModel(modelName) {
            loadModel(modelName);
        }

        compassBtn.addEventListener('click', () => {
            orientMode = !orientMode;
            compassBtn.style.background = orientMode
                ? 'rgba(255, 100, 100, 0.8)'
                : 'rgba(0, 0, 0, 0.6)';
            
            // Disable OrbitControls (manual control) when in device orientation mode
            controls.enabled = !orientMode;

            if (orientMode) {
                hasInitial = false; 
            }
        });

        // --- DEVICE ORIENTATION LOGIC (Uses Alpha/Compass when orientMode is true) ---
        function normalizeAngle(angle) {
            angle = angle % 360;
            if (angle < 0) angle += 360;
            return angle;
        }

        function smoothRotate(alpha) {
            if (!hasInitial) {
                offset = alpha;
                lastAlpha = alpha;
                hasInitial = true;
            }

            let diff = alpha - lastAlpha;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;
            lastAlpha += diff * 0.1; 
            
            let smoothAlpha = normalizeAngle(lastAlpha - offset);

            compassBtn.style.transform = `rotate(${smoothAlpha}deg)`;

            if (orientMode) {
                const target = controls.target;
                
                // Get current distance to maintain zoom level
                const currentDistance = camera.position.distanceTo(target);

                // Convert compass angle (degrees) to yaw rotation (radians)
                const yaw = THREE.MathUtils.degToRad(smoothAlpha + 90);
                
                // Calculate the new camera position around the target
                const newX = target.x + currentDistance * Math.cos(yaw);
                const newZ = target.z + currentDistance * Math.sin(yaw);
                
                // Apply the new position, maintaining the current camera height (Y)
                camera.position.set(newX, camera.position.y, newZ);
                
                // Force camera to look at the target center
                camera.lookAt(target);
            }
        }

        function onDeviceOrientation(e) {
            if (e.alpha != null) smoothRotate(e.alpha);
        }
        
        // Start the application
        init();
    </script>
</body>
</html>
